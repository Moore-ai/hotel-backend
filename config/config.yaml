server:
  port: "8080"

database:
  host: "localhost"
  port: "5433"
  user: "postgres"
  password: "postgres"
  dbname: "hotel"
  sslmode: "disable"

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

jwt:
  secret: "change-me-in-production"
