server:
  port: "8080"

database:
  host: "localhost"
  port: "5433"
  user: "postgres"
  password: "postgres"
  dbname: "hotel"
  sslmode: "disable"

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

jwt:
  secret: "change-me-in-production"
  access_token_expiry: "2h"
  refresh_token_expiry: "168h"

checkout:
  first_threshold: "12:00"
  second_threshold: "18:00"
  scheduler_interval: 300 # 5 minutes in seconds

admin:
  username: "admin"
  password: "admin123"
  name: "超级管理员"

allocation:
  strategy: "low_floor" # low_floor, high_floor

cancellation:
  cutoff_hours: 24  # CANCELLATION_CUTOFF_HOURS
  default_reject_reason: "无"
  notify_strategy: "random_one"  # staff_and_admin | all_staff | random_one
  notify_staff_ids: []

appeal:
  review_strategy: "admin_only"  # admin_only | random_one
  review_staff_ids: []

llm:
  base_url: "https://api.deepseek.com/anthropic"
  api_key: "${ANTHROPIC_API_KEY}"
  model: "deepseek-v4-flash"
  max_tokens: 1024
  timeout: 30s
  system_prompt: "你是酒店的智能管家，你的职责是协助住客解答疑问、提供服务和帮助。请用中文回复，保持友好专业的态度。"
  max_history: 20
